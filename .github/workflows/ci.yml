name: RekanVault Phase 1 CI

on:
  push:
    branches: [main, "feat/*", "fix/*"]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: |
          uv venv
          . .venv/bin/activate
          uv pip install -e ".[dev]"
      - name: Run Pytest
        run: |
          . .venv/bin/activate
          pytest --cov=rekanvault --cov-report=term-missing
      - name: Run Ruff Lint & Format Check
        run: |
          . .venv/bin/activate
          ruff check .
          ruff format --check .
      - name: Run Mypy Typecheck
        run: |
          . .venv/bin/activate
          mypy rekanvault apps/api apps/worker
      - name: Test Schema Export
        run: |
          . .venv/bin/activate
          python -m rekanvault.contracts.export

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build Web Application
        run: pnpm run build
