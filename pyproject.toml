[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rekanvault"
version = "0.1.0"
description = "RekanVault — Personal Knowledge Base & RAG Engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Private" }
authors = [
    { name = "Ibrahim Muhammad Isa", email = "imi@rekanvault.local" }
]

dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "jsonschema>=4.21.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "orjson>=3.10.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.19",
    "alembic>=1.13.0",
    "pyjwt[crypto]>=2.8.0",
    "cryptography>=42.0.0",
    # P3 — Source connectors & extraction
    "google-api-python-client>=2.130.0",
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "markdown-it-py>=3.0.0",
    # P4 — Retrieval, embeddings, and chunking
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.1.0",
    "transformers>=4.43.0",
    "torch>=2.3.0",
    "tiktoken>=0.7.0",
    # P5 — LLM extraction provider (RV-DEC-P5-0002); OpenAI-compatible SDK
    "openai>=1.40.0",
    # P5 — JSON recovery for malformed LLM output (retry ladder in llm.py)
    "json-repair>=0.40.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12.20240311",
    "types-jsonschema>=4.21.0.20240118",
]

[project.scripts]
rekanvault = "rekanvault.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["rekanvault", "apps"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".codex",
    ".omx",
    ".omg",
    ".venv",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
asyncio_mode = "auto"
